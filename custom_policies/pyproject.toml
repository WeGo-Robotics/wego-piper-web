[project]
# ⚠ 이름이 규약이다. LeRobot 이 `lerobot_policy_` 로 시작하는 배포를 `lerobot-train`
# 시작 시 자동 import 한다 (lerobot/utils/import_utils.py:register_third_party_plugins).
# 배포 이름 = import 할 모듈 이름이다 — 둘을 따로 바꾸면 정책 전부가 "not available" 로 죽는다.
#
# 커스텀 정책은 **전부 이 배포 하나**에 둔다 (custom_policies/README.md). 정책마다 배포를
# 따로 두면 정책 하나를 더할 때마다 설치 목록 다섯 곳(install.sh · Dockerfile 둘 · 테스트 둘)을
# 고쳐야 하고, 공용 stage 헤드·굽기 코드를 어느 배포에 둘지도 정해야 한다.
name = "lerobot_policy_piper"
version = "0.1.0"
description = "Piper 커스텀 정책 — 행동 + 작업 단계(stage)를 함께 내는 ACT-S · SmolVLA-S (feature/act-s.md)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lerobot>=0.5.0"]

# 굽기(bake)는 parquet 만 만진다 — 정책 런타임에 pandas 를 끌고 오지 않는다.
[project.optional-dependencies]
bake = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["lerobot_policy_piper*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
