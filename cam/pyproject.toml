[project]
name = "piper-cam"
version = "0.1.0"
description = "Piper v4l2 camera daemon core (owns /dev/video*)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy", "piper-shm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piper_cam*"]
