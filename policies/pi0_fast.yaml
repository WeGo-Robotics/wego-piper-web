# π0-FAST
# ⚠ `supported: false` — 정의는 남기고 꺼둔다. 스키마·클래스 경로가 이미 붙어
# 있어서 되살릴 때 이 한 줄만 바꾸면 된다.
spec_version: 1
type: pi0_fast
label: π0-FAST
supported: false

capabilities:
  train: true
  infer: true
  rtc: false
  encoder_probe: false
  language: true

runtime:
  model: [lerobot.policies.pi0_fast.modeling_pi0_fast, PI0FastPolicy]
  config: [lerobot.policies.pi0_fast.configuration_pi0_fast, PI0FastConfig]

train:
  # ⚠ `freeze_vision_encoder` 는 여기 없다. 옛 프론트 스키마에는 있었는데
  # **PI0FastConfig 에 그런 필드가 없다** — 생성기가 잡았다. 켰으면 학습
  # 시작에서 알 수 없는 설정 키로 죽었을 것이다.
  defaults: { batch_size: 32, steps: 30000, optimizer_type: adamw }
  fields:
    - { key: chunk_size, kind: number, min: 1, max: 200, arch: true, from_lerobot: true, default: 50 }
    - { key: n_action_steps, kind: number, min: 1, max: 200, arch: true, from_lerobot: true, default: 50 }
    - { key: max_decoding_steps, kind: number, min: 1, max: 1024, arch: true, from_lerobot: true, default: 256 }
    - { key: gradient_checkpointing, kind: bool, from_lerobot: true, default: false }
