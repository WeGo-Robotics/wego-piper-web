[project]
name = "piper-web-backend"
version = "0.1.0"
description = "LeRobot web interface backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "pyzmq>=26.0",
    "websockets>=13.0",
    "huggingface-hub>=0.25",
    "pandas>=2.0",
    "plotly>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
analysis = [
    "matplotlib>=3.8",
]
realsense = [
    "pyrealsense2>=2.56",
]
