[project]
name = "piper-web-backend"
version = "0.1.0"
description = "LeRobot web interface backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "pyzmq>=26.0",
    "redis>=5.0",
    "websockets>=13.0",
    "huggingface-hub>=0.25",
    "pandas>=2.0",
    "plotly>=6.0",
    # 정책 스펙(`policies/*.yaml`). 주석이 달린다는 게 YAML 을 고른 이유라
    # JSON 으로 타협하지 않았다 (feature/policy-ui-spec.md).
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
# 평평한 레이아웃에서 app 패키지만 배포 대상으로 지정.
# (udev/data 등 비패키지 디렉터리가 있으면 자동탐색이 실패하므로 명시)
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
analysis = [
    "matplotlib>=3.8",
]
realsense = [
    "pyrealsense2>=2.56",
]
