# __NAME__ — 1층 플러그인 틀. `loop()` 하나로 뭐든 한다. (feature/plugins.md §7-1)
name: __NAME__
version: 0.1.0
title: "__NAME__"
description: "카메라를 읽어 무언가 하고 상태를 올린다"
entry: main.py
python: system

cameras:
  - { key: cam, label: "카메라", required: true }

config:
  - { key: interval_s, kind: number, default: 0.5, min: 0.05, max: 10, step: 0.05, label: "주기(초)" }

permissions:
  - activity.read

resources: { gpu: false, heartbeat: false }

outputs:
  previews: ["__NAME___cam"]
  state:
    - { key: frames, label: "프레임" }
