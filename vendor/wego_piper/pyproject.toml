[project]
name = "wego_piper"
version = "0.0.2"
description = "WeGo Piper servo comms (packet/port handler) — vendored for container build"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "piper_sdk",
]

[tool.setuptools.packages.find]
include = ["wego_piper*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
