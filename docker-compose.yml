# piper-web full-stack (backend + LeRobot + frontend).
#
# 반드시 로봇이 물리적으로 연결된 호스트에서 실행한다.
# 사전 요구사항 (호스트, 컨테이너 밖):
#   - nvidia-container-toolkit 설치 (GPU 패스스루)
#   - CAN 인터페이스(can_follower1 등) 호스트에서 구성/기동
#   - v4l2loopback 커널 모듈 호스트에 로드 (커널 모듈은 컨테이너에서 삽입 불가)
#   - RealSense udev 규칙(backend/udev/99-realsense-libusb.rules)을 호스트 /etc/udev/rules.d/ 에 설치
#   - **호스트 redis 에 유닉스 소켓 켜기** (/etc/redis/redis.conf):
#         unixsocket /run/redis/redis-server.sock
#         unixsocketperm 770
#     컨테이너는 TCP 가 아니라 이 소켓으로 버스에 붙는다 — 버스는 E-stop
#     heartbeat 을 나르므로 네트워크에 열어둘 이유가 없다.
#   - **하드웨어 데몬을 호스트에서 기동** (deploy/systemd/piper-{estopd,rsd,camerad,robotd}.service)
#     이 컨테이너는 장치를 전혀 열지 않는다 — 카메라는 `/dev/shm` 세그먼트로,
#     로봇은 프록시 드라이버로 데몬을 거친다. 데몬이 안 뜨면 카메라도 팔도 안 보인다.
#   - 데이터 루트 생성:  sudo mkdir -p /srv/piper-data
#     (경로 변경은 PIPER_DATA_ROOT 로. 컨테이너는 항상 /data 로 본다)
#
# 실행:  docker compose up -d --build
# 접속:  http://<호스트IP>/        (nginx :80 → backend :8000 프록시)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: piper-web-backend
    container_name: piper-web-backend
    # ⚠ `network_mode: host` 를 **뺐다.** 로봇이 shm 프록시로 바뀌어 raw CAN 을
    # 안 쓰고, 남아 있던 두 이유도 각각 해결했다:
    #   Redis   → 호스트 유닉스 소켓 마운트 (아래 volumes)
    #   nginx   → 브리지 네트워크의 서비스 이름 `backend:8000`
    networks: [piper]
    expose: ["8000"]
    # 세그먼트를 호스트 데몬과 공유한다 — 이게 없으면 카메라·로봇 프레임이 안 보인다.
    # `/dev/shm` 은 기본적으로 컨테이너마다 격리되기 때문이다.
    ipc: host
    # ⚠ `privileged` 와 `/dev` 마운트를 **뺐다.** 이 컨테이너는 장치를 안 연다:
    # 카메라는 rsd/camerad 가, CAN 은 robotd 가 호스트에서 독점하고 여기로는
    # shm 세그먼트만 온다 (refactor/camera-transport.md · robot-transport.md).
    # 되돌려야 한다면 그건 무언가가 아직 장치를 직접 열고 있다는 뜻이다 — 그걸 찾아라.
    volumes:
      # 데이터는 이 하나로 끝. 내부 레이아웃(/data/hf, outputs, logs, config)과
      # 각 PIPER_* 경로는 backend/Dockerfile 의 "데이터 경로 계약" ENV 에 정의돼 있다.
      # 호스트 절대경로가 컨테이너로 새어 들어가지 않도록 호스트의 ~/.cache/huggingface
      # 나 ~/.config/piper-web 은 일부러 마운트하지 않는다 (환경별 경로 오염 방지).
      - ${PIPER_DATA_ROOT:-/srv/piper-data}:/data
      # 호스트 데몬(rsd/camerad/robotd/estopd)과 같은 버스를 본다.
      # ⚠ **호스트 redis 에 `unixsocket` 설정이 켜져 있어야 한다** —
      # 기본 redis.conf 는 주석 처리돼 있다:
      #     unixsocket /run/redis/redis-server.sock
      #     unixsocketperm 770
      # TCP 로 노출하지 않는 편이 낫다: 버스는 E-stop heartbeat 을 나르므로
      # 네트워크에 열어둘 이유가 없다.
      - /run/redis:/run/redis
    environment:
      # ⚠ **권한을 뺀 것과 한 묶음이다.** `direct` 로 두면 컨테이너가 장치를 직접
      # 열려다 죽는다 — 열 권한이 없기 때문이다. 되돌리려면 위의 privileged/dev 도
      # 같이 되돌려야 한다. 둘 중 하나만 바꾸면 조용히 안 되는 조합이 된다.
      - PIPER_CAMERA_TRANSPORT=shm
      - PIPER_ROBOT_TRANSPORT=shm
      # 유닉스 소켓 — `redis.Redis.from_url` 이 그대로 받는다 (코드 변경 없음)
      - PIPER_REDIS_URL=unix:///run/redis/redis-server.sock?db=0
      - PIPER_LOCAL_PYTHON=/opt/venv/bin/python
      - PIPER_GRPC_PYTHON=/opt/venv/bin/python
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all                        # compute+video (NVDEC/torchcodec)
    # GPU (nvidia-container-toolkit). 아래가 안 되면 `runtime: nvidia` 로 대체.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: piper-web-frontend
    container_name: piper-web-frontend
    # nginx 는 브리지 안에서 `backend:8000` 으로 프록시한다 (frontend/nginx.conf).
    # :80 만 호스트로 낸다 — 이제 컨테이너가 호스트 네트워크에 들어갈 이유가 없다.
    networks: [piper]
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# 두 컨테이너만 서로를 본다. 호스트 네트워크를 쓰지 않으므로 이름 해석이 필요하다.
networks:
  piper:
    driver: bridge
