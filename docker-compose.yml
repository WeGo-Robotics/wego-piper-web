# piper-web full-stack (backend + LeRobot + frontend).
#
# 반드시 로봇이 물리적으로 연결된 호스트에서 실행한다.
# 사전 요구사항 (호스트, 컨테이너 밖):
#   - nvidia-container-toolkit 설치 (GPU 패스스루)
#   - CAN 인터페이스(can_follower1 등) 호스트에서 구성/기동
#   - v4l2loopback 커널 모듈 호스트에 로드 (커널 모듈은 컨테이너에서 삽입 불가)
#   - RealSense udev 규칙(backend/udev/99-realsense-libusb.rules)을 호스트 /etc/udev/rules.d/ 에 설치
#   - 데이터 루트 생성:  sudo mkdir -p /srv/piper-data
#     (경로 변경은 PIPER_DATA_ROOT 로. 컨테이너는 항상 /data 로 본다)
#
# 실행:  docker compose up -d --build
# 접속:  http://<호스트IP>/        (nginx :80 → backend :8000 프록시)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: piper-web-backend
    container_name: piper-web-backend
    # CAN 넷디바이스 접근 + ZMQ localhost + nginx→backend 도달을 위해 호스트 네트워크
    network_mode: host
    # 하드웨어: raw CAN 소켓, /dev/video*, RealSense libusb, USB 리바인딩 복구(/sys 쓰기) 모두 필요
    privileged: true
    volumes:
      - /dev:/dev                                             # 카메라/USB 장치 노드 (핫플러그 포함)
      - /run/udev:/run/udev:ro                                # libusb/RealSense udev 조회
      - /lib/modules:/lib/modules:ro                          # modprobe gs_usb (USB-CAN 어댑터 드라이버)
      # 데이터는 이 하나로 끝. 내부 레이아웃(/data/hf, outputs, logs, config)과
      # 각 PIPER_* 경로는 backend/Dockerfile 의 "데이터 경로 계약" ENV 에 정의돼 있다.
      # 호스트 절대경로가 컨테이너로 새어 들어가지 않도록 호스트의 ~/.cache/huggingface
      # 나 ~/.config/piper-web 은 일부러 마운트하지 않는다 (환경별 경로 오염 방지).
      - ${PIPER_DATA_ROOT:-/srv/piper-data}:/data
    environment:
      - PIPER_LOCAL_PYTHON=/opt/venv/bin/python
      - PIPER_GRPC_PYTHON=/opt/venv/bin/python
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all                        # compute+video (NVDEC/torchcodec)
    # GPU (nvidia-container-toolkit). 아래가 안 되면 `runtime: nvidia` 로 대체.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: piper-web-frontend
    container_name: piper-web-frontend
    # host network 인 backend 에 127.0.0.1:8000 으로 프록시하기 위해 동일하게 호스트 네트워크
    network_mode: host   # nginx :80
    depends_on:
      - backend
    restart: unless-stopped
