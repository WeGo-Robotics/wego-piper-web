# piper-web 프론트 서빙 + 백엔드 리버스 프록시.
# network_mode: host 라서 백엔드는 127.0.0.1:8000 로 도달한다.

upstream piper_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA: 정적 파일 우선, 없으면 index.html 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket (로그 스트리밍 / 프로세스 상태)
    location /ws {
        proxy_pass http://piper_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # 장시간 연결 유지
        proxy_send_timeout 3600s;
    }

    # REST API + MJPEG 프리뷰/영상 스트림
    location /api/ {
        proxy_pass http://piper_backend;
        proxy_buffering off;         # 스트리밍 프리뷰 즉시 전달
        proxy_read_timeout 3600s;
        client_max_body_size 0;      # 대용량 업로드 제한 해제
    }

    location /health {
        proxy_pass http://piper_backend;
    }
}
