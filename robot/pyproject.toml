[project]
name = "piper-robot"
version = "0.1.0"
description = "Piper arm CAN ownership, safety filter, shm publishing (robotd body)"
requires-python = ">=3.10"
license = "Apache-2.0"
# ⚠ `piper-sdk` 는 **팔을 여는 데 필수**다 (arm.connect 의 늦은 import). 선언이 없어
#   호스트 venv 에 안 깔렸고, [연결] 이 `piper_sdk not installed` 로 끝났다 (NUC 2026-09-15).
#   ⚠ 다만 `apply.sh` 는 wheel 을 `--no-deps` 로 깐다 — 실제 설치는 그쪽이 책임진다.
#   여기 선언은 "이 패키지가 무엇을 필요로 하는가"의 정본이다.
dependencies = ["piper-shm", "piper-bus", "numpy>=1.24", "piper-sdk>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 하드웨어를 실제로 만질 때만 필요하다 — `arm.py` 가 가드된 import 로 받고,
# 없으면 "piper_sdk not installed" 를 돌려준다. 안전층·기구학 테스트는 이것 없이 돈다.
[project.optional-dependencies]
hardware = ["piper_sdk"]

[tool.setuptools.packages.find]
include = ["piper_robot*"]

# ⚠ 구운 지오메트리는 **코드가 아니라 데이터**라 이걸 안 적으면 비편집(non-editable)
#   설치에서 통째로 빠진다. 그러면 바닥 필터가 조용히 꺼진다 — robotd 를 호스트에
#   배포할 때 정확히 그 경로를 탄다.
[tool.setuptools.package-data]
piper_robot = ["data/*.npz"]
