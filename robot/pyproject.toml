[project]
name = "piper-robot"
version = "0.1.0"
description = "Piper arm CAN ownership, safety filter, shm publishing (robotd body)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["piper-shm", "piper-bus", "numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 하드웨어를 실제로 만질 때만 필요하다 — `arm.py` 가 가드된 import 로 받고,
# 없으면 "piper_sdk not installed" 를 돌려준다. 안전층·기구학 테스트는 이것 없이 돈다.
[project.optional-dependencies]
hardware = ["piper_sdk"]

[tool.setuptools.packages.find]
include = ["piper_robot*"]

# ⚠ 구운 지오메트리는 **코드가 아니라 데이터**라 이걸 안 적으면 비편집(non-editable)
#   설치에서 통째로 빠진다. 그러면 바닥 필터가 조용히 꺼진다 — robotd 를 호스트에
#   배포할 때 정확히 그 경로를 탄다.
[tool.setuptools.package-data]
piper_robot = ["data/*.npz"]
