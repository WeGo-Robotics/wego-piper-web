[project]
name = "piper-sim"
version = "0.1.0"
description = "Piper MuJoCo simulation daemon core — publishes the same shm contracts as robotd"
requires-python = ">=3.10"
license = "Apache-2.0"
# piper-robot: 정규화 표(joints)·안전 필터(safety)·기구학(armmodel)을 **그대로** 쓴다 —
# 표가 둘이면 실기 정책이 시뮬에서 다른 숫자를 본다 (feature/sim-env.md §2).
dependencies = ["mujoco>=3.1", "numpy", "piper-shm", "piper-robot", "piper-bus", "piper-cam"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piper_sim*"]

[tool.setuptools.package-data]
# ⚠ **메시도 담는다.** 예전엔 XML 만 담고 메시는 서브모듈을 상대경로로 가리켰는데,
#   그 경로는 저장소 체크아웃에서만 맞다 — wheel 로 설치하면 안 닿아서 월드가 안
#   뜨고 팔·카메라가 등록되지 않았다(실기 .120, v0.4.6). 씬이 쓰는 STL 일곱 개만
#   `assets/meshes/` 에 있고, `tools/build_sim_scene.py` 가 거기 채운다.
piper_sim = ["assets/*.xml", "assets/meshes/*.stl"]
